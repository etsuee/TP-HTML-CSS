<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Connexion - TechCorp RH</title>
    <meta
      name="description"
      content="Une phrase qui resume le contenu de la page."
    />

    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="css/main.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="auth">
      <div class="auth__aside">
        
      
      </div>

      <main class="auth__main">
        <div class="auth__panel">
          <h1>Connexion</h1>
          <p>Utilisez votre adresse e-mail professionnele</p>

          <form>
            <div class="field">
              <label class="field__label" for="email">Adresse e-mail</label>
              <input
                class="input"
                type="email"
                id="email"
                name="email"
                autocomplete="username"
              required
              />
            </div>

            <div class="field">
              <div>
                <label class="field__label" for="password">Mot de passe</label>
                <a class="text-sm" href="">Mot de passe oublie?</a>
              </div>

              <input
                class="input"
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>

            <label class="checkbox">
              <input type="checkbox" name="remember" />
              <span>Rester connecté</span>
            </label>

            <button class="btn btn--primary btn-block" type="submit">
              Se connecter
            </button>
          </form>

          <footer></footer>
        </div>
      </div>
    
    </main>
  </body>
</html>
