<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Guide de style - TechCorp RH</title>
    <meta
      name="description"
      content="Documentation guide de style TechCorp RH"
    />

    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header></header>
    <main>
      <h1>Design system TechCorp RH</h1>

      <section id="section-couleurs">
        <div>
          <h2>Couleur sémantiques</h2>

          <div></div>
        </div>
      </section>
      <section id="section-typo"></section>
      <section id="section-espacement"></section>
      <section id="section-boutons"></section>
      <section id="section-badges"></section>
      <section id="section-alertes">
        <h2>Alertes</h2>
        <div class="alert alert--success" role="status">
          <p>Demande envoyée</p>
        </div>

        <div class="alert alert--warning" role="alert">
          <p>Le format de votre fichier n'est pas supporté</p>
        </div>

        <div class="alert alert--error" role="alert">
          <p>Something went wrong. Try again</p>
        </div>
      </section>
      <section id="section-cartes"></section>
    </main>
    <footer></footer>

    <script src="js/app.js" defer></script>
  </body>
</html>
