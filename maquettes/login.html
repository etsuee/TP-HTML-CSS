<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Connexion - TechCorp RH</title>
    <meta
      name="description"
      content="Page de connexion TechCorp RH."
    />

    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="css/main.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="auth">
      <aside class="auth__aside">
        <p> 
          <img src ="assets/logo.svg" alt="Logo TechCorp" width="32" height="32">
        TechCorp RH
        </p>
        <div>
          <p> Vos congés, votre matériel et vos notes de frais, au même endroit.</p>
          <p>La plateforme RH interne de TechCorp</p>
        </div>
        <p>© TechCorp 2026</p>
      </aside>

      <main class="auth__main">
        <div class="auth__panel">
          <h1>Connexion</h1>
          <p>Utilisez votre adresse e-mail professionnele</p>

          <form class="form" action="" method="post">
            <div class="field">
              <label class="field__label" for="email">Adresse e-mail</label>
              <input
                class="input"
                type="email"
                id="email"
                name="email"
                autocomplete="username"
              required
              />
            </div>

            <div class="field">
              <div>
                <label class="field__label" for="password">Mot de passe</label>
                <a class="text-sm" href="">Mot de passe oublie?</a>
              </div>

              <input
                class="input"
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>

            <label class="checkbox">
              <input type="checkbox" name="remember" />
              <span>Rester connecté</span>
            </label>

            <button class="btn btn--primary btn--block" type="submit">
              Se connecter
            </button>
          </form>

          <footer>
            <a href="#">Mentions légales</a> 
            <a href="#">Politique de confidentialité</a> 
            <a href="#">Accessibilité</a>
          </footer>
        </div>
      </div>
    
    </main>
  </body>
</html>
